name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docker-image:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - name: checkout
          uses: actions/checkout@v3

        - name: set up qemu
          uses: docker/setup-qemu-action@v2

        - name: set up buildx
          uses: docker/setup-buildx-action@v2

        - name: generate image identifier
          id: image
          uses: ASzc/change-string-case-action@v5
          with:
            string: ${{ github.repository_owner }}

        - name: login to ghcr
          uses: docker/login-action@v2
          if: ${{ github.ref == 'refs/heads/main'}}
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: build web image (production)
          uses: docker/build-push-action@v3
          if: ${{ github.ref == 'refs/heads/main'}}
          with:
            context: .
            push: ${{ github.ref == 'refs/heads/main' }}
            tags: |
              ghcr.io/${{ steps.image.outputs.lowercase }}/norman-mcp-server:latest
              ghcr.io/${{ steps.image.outputs.lowercase }}/norman-mcp-server:${{ github.sha }}

            build-args: |
              RELEASE=${{ github.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

  deploy-production:
    needs: build-docker-image
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'norman-finance'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3

      # Release bookkeeping must never gate the deploy. A transient Sentry API
      # error (SSL reset, 5xx) used to skip "update mcp server image" entirely,
      # so a green build sat in the registry while prod kept running the old
      # image — including when the deploy was carrying a security fix.
      - name: draft sentry release
        uses: getsentry/action-release@v1
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          finalize: false

      - name: read image identifiers
        id: image
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository_owner }}

      - name: update mcp server image
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            service="norman_mcp"
            image="ghcr.io/${{ steps.image.outputs.lowercase }}/norman-mcp-server:${{ github.sha }}"

            diagnostics() {
              # Never print the full service spec here: it contains runtime
              # environment variables and can expose credentials in CI logs.
              docker service inspect "$service" \
                --format 'UpdateStatus={{if .UpdateStatus}}{{.UpdateStatus.State}}: {{.UpdateStatus.Message}}{{else}}unknown{{end}}' || true
              docker service inspect "$service" \
                --format 'Image={{.Spec.TaskTemplate.ContainerSpec.Image}}' || true
              docker service ps "$service" --no-trunc || true
              docker service logs "$service" --tail 200 || true
            }

            docker service update "$service" --image "$image" --with-registry-auth

            # `docker service update` can report "Service converged" a few
            # seconds before Swarm changes UpdateStatus from updating to
            # completed. Wait for the terminal state instead of failing that
            # successful deployment race.
            state="unknown"
            attempt=0
            while [ "$attempt" -lt 60 ]; do
              state=$(docker service inspect "$service" \
                --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}unknown{{end}}' 2>/dev/null || echo unknown)

              case "$state" in
                completed)
                  break
                  ;;
                rollback_started|rollback_paused|rollback_completed|paused)
                  echo "Deployment entered a failure state: $state" >&2
                  diagnostics
                  exit 1
                  ;;
              esac

              attempt=$((attempt + 1))
              sleep 2
            done

            running_image=$(docker service inspect "$service" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')

            if [ "$state" != "completed" ]; then
              echo "Deployment did not reach completed state within 120 seconds: $state" >&2
              diagnostics
              exit 1
            fi

            case "$running_image" in
              "$image"|"$image"@*) ;;
              *)
                echo "Deployment image mismatch: expected $image, running $running_image" >&2
                diagnostics
                exit 1
                ;;
            esac

      - name: finalize sentry release
        uses: getsentry/action-release@v1
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          finalize: true
